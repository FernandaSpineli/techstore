<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechStore</title>
  <meta name="description" content="Loja de eletrônicos de demonstração da API TechStore">
  <meta name="theme-color" content="#e4e5e1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Martian+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ffc425'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%2322262a'/%3E%3C/svg%3E">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>
  <header class="bar">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>TechStore</a>
    <form class="search" role="search" id="search-form">
      <label for="q" class="sr-only">Buscar produtos</label>
      <input id="q" name="q" type="search" placeholder="Buscar por produto ou marca" autocomplete="off">
    </form>
    <nav class="account" id="account" aria-label="Conta"></nav>
  </header>

  <div class="layout">
    <main id="main" tabindex="-1" aria-live="polite"></main>

    <aside class="trace" id="trace" aria-label="Requisições à API">
      <div class="bezel">
        <div class="trace-head">
          <h2>Requisições à API</h2>
          <p>Cada chamada que esta página faz, a mais recente no topo.</p>
        </div>
        <div class="screen">
          <ol id="trace-list" class="trace-list"></ol>
          <p class="screen-empty">Aguardando a primeira chamada</p>
        </div>
      </div>
    </aside>
  </div>
  <button class="trace-toggle" id="trace-toggle" type="button" aria-controls="trace" aria-expanded="false">Ver requisições</button>
</body>
</html>
