name: techstore

# Credentials below are for local development only.
x-app: &app
  build: .
  image: techstore-api:dev
  environment:
    APP_ENV: development
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DATABASE_URL: postgres://techstore:techstore@postgres:5432/techstore?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
    SMTP_ADDR: mailpit:1025
    ORDER_RESERVATION_TTL: ${ORDER_RESERVATION_TTL:-30m}

services:
  # Applies schema migrations once, before the API starts.
  migrate:
    <<: *app
    command: ["migrate", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: techstore
      POSTGRES_PASSWORD: techstore
      POSTGRES_DB: techstore
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techstore -d techstore"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every outgoing email; open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
